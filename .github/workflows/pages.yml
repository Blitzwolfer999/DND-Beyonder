name: Deploy DND Beyonder to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configure account sync
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const fallback = {
            supabaseUrl: "https://ifvygjdmdzpdllbfrayv.supabase.co",
            supabasePublishableKey: "sb_publishable_w7XYEVe4DZucUjRz-xiLMg_Wgm2Q-tg"
          };
          const config = fallback;
          fs.writeFileSync("cloud-config.js", `window.ARCANA_CLOUD_CONFIG = ${JSON.stringify(config, null, 2)};\n`);
          NODE
      - name: Harden deployed account sync
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const htmlPath = "index.html";
          const fallback = {
            supabaseUrl: "https://ifvygjdmdzpdllbfrayv.supabase.co",
            supabasePublishableKey: "sb_publishable_w7XYEVe4DZucUjRz-xiLMg_Wgm2Q-tg"
          };
          let html = fs.readFileSync(htmlPath, "utf8");
          const inlineConfig = `  <script>\n    window.ARCANA_CLOUD_CONFIG = {\n      supabaseUrl: "${fallback.supabaseUrl}",\n      supabasePublishableKey: "${fallback.supabasePublishableKey}"\n    };\n  </script>`;
          html = html
            .replace(/<script src="cloud-config\.js\?v=[^"]+"><\/script>/, `<script src="cloud-config.js?v=supabase-ifvyg-3"></script>\n${inlineConfig}`)
            .replace(/<script src="app\.js\?v=[^"]+"><\/script>/, '<script src="app.js?v=auth-fetch-2"></script>');
          fs.writeFileSync(htmlPath, html);
          NODE
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
